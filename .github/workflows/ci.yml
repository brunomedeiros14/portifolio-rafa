name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sem permissões de escrita: o build não precisa de nada além de ler o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # O build é a única coisa que valida de fato: é ele que exercita o
      # content collection, o schema do frontmatter e a otimização de imagens.
      # Falhar só no `astro check` deixaria erros de runtime passarem.
      - name: Build
        run: pnpm build
