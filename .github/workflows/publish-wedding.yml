name: Publish Wedding

on:
  repository_dispatch:
    types:
      - publish-wedding

permissions:
  contents: write

jobs:

  publish:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get publication
        id: publication
        env:
          PUBLICATION_ID: ${{ github.event.client_payload.publication_id }}
          URL_ID: ${{ github.event.client_payload.url_id }}
          CMS_API_TOKEN: ${{ secrets.CMS_API_TOKEN }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const urlId = process.env.URL_ID;
            if (!urlId || urlId.includes("undefined") || urlId.includes("(")) {
              console.error("Faltou github.event.client_payload.url_id (id da URL /macros/s/<id>/exec).");
              process.exit(1);
            }
            const cmsUrl = `https://script.google.com/macros/s/${urlId}/exec`;
            const res = await fetch(cmsUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              redirect: "follow",
              body: JSON.stringify({
                action: "publication",
                token: process.env.CMS_API_TOKEN,
                publicationId: process.env.PUBLICATION_ID,
              }),
            });
            const body = await res.text();
            fs.writeFileSync("publication.json", body);
            console.log(`HTTP ${res.status} | ${body.length} bytes`);
            console.log(body.slice(0, 400));
            if (res.status !== 200 || !body.trim()) {
              console.error(`GAS respondeu HTTP ${res.status}. Confirme que a URL ${cmsUrl} é o deployment Web App.`);
              process.exit(1);
            }
            try { JSON.parse(body); }
            catch { console.error("Resposta não é JSON válido."); process.exit(1); }
          '

      - name: Generate content
        run: |
          node scripts/generate-wedding.mjs publication.json

      - name: Validate
        run: |
          pnpm check

      - name: Commit
        run: |
          git config user.name "Portfolio CMS"
          git config user.email "portfolio-cms@users.noreply.github.com"

          git add .

          git diff --cached --quiet || \
            git commit \
              -m "feat(wedding): add ${{ github.event.client_payload.publication_id }}"

          git push