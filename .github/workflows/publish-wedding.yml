name: Publish Wedding

on:
  repository_dispatch:
    types:
      - publish-wedding

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Get publication
        id: publication
        env:
          PUBLICATION_ID: ${{ github.event.client_payload.publication_id }}
          URL_ID: ${{ github.event.client_payload.url_id }}
          CMS_API_TOKEN: ${{ secrets.CMS_API_TOKEN }}
        run: |
          bun apps/portifolio/scripts/get-wedding.ts

      - name: Generate content
        run: |
          bun apps/portifolio/scripts/generate-wedding.mjs publication.json

      - name: Typecheck
        run: |
          bun run check

      # `astro check` não executa o build, então um frontmatter inválido ou uma
      # imagem quebrada só apareceria no deploy da Cloudflare. Validar aqui evita
      # commitar conteúdo que não constrói.
      - name: Build
        run: |
          bun run build

      - name: Commit
        run: |
          git config user.name "Portfolio CMS"
          git config user.email "portfolio-cms@users.noreply.github.com"

          # Lista explícita: `git add .` também entraria no publication.json
          # baixado acima, que é artefato temporário de uma execução.
          git add apps/portifolio/src/content/weddings .gitignore

          git diff --cached --quiet || \
            git commit \
              -m "feat(wedding): add ${{ github.event.client_payload.publication_id }}"

          git push
