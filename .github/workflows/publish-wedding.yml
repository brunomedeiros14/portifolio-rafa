name: Publish Wedding

on:
  repository_dispatch:
    types:
      - publish-wedding

permissions:
  contents: write

jobs:

  publish:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Get publication
        id: publication
        env:
          PUBLICATION_ID: ${{ github.event.client_payload.publication_id }}
          CMS_URL: ${{ secrets.CMS_URL }}
          CMS_API_TOKEN: ${{ secrets.CMS_API_TOKEN }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"action\": \"publication\",
              \"token\": \"${CMS_API_TOKEN}\",
              \"publicationId\": \"${PUBLICATION_ID}\"
            }" \
            "${CMS_URL}" \
            > publication.json

      - name: Generate content
        run: |
          node scripts/generate-wedding.mjs publication.json

      - name: Validate
        run: |
          pnpm check

      - name: Commit
        run: |
          git config user.name "Portfolio CMS"
          git config user.email "portfolio-cms@users.noreply.github.com"

          git add .

          git diff --cached --quiet || \
            git commit \
              -m "feat(wedding): add ${{ github.event.client_payload.publication_id }}"

          git push