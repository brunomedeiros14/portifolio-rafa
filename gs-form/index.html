<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --text: #16120e;
      --muted: #6b5f53;
      --line: #e5ddcf;
      --accent: #9c6f4d;
      --accent-dark: #7c5737;
      --ok: #2f7d4f;
      --warn: #b4682d;
      --danger: #b23b3b;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(22, 18, 14, .06), 0 8px 24px rgba(22, 18, 14, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header.top {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 20px;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    header.top .brand { font-family: Georgia, serif; font-style: italic; font-size: 20px; }
    header.top .brand small { display: block; font-family: system-ui; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
    main { max-width: 920px; margin: 0 auto; padding: 24px 20px 80px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }
    button, .btn {
      font: inherit; cursor: pointer; border-radius: 8px;
      padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
      transition: background .12s ease, border-color .12s ease, opacity .12s ease;
    }
    button:hover { background: #f4eee5; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    button.danger { color: var(--danger); border-color: var(--line); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.small { padding: 4px 9px; font-size: 13px; border-radius: 6px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; background: #f4eee5; }
    .toolbar button { padding: 5px 9px; font-size: 13px; border-radius: 6px; }
    .toolbar button.b { font-weight: 700; } .toolbar button.i { font-style: italic; } .toolbar button.u { text-decoration: underline; }
    .toolbar button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    [contenteditable].editor {
      border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius);
      background: var(--surface); min-height: 220px; padding: 14px 16px;
      outline: none;
    }
    [contenteditable].editor:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(156,111,77,.15); }
    [contenteditable].editor p { margin: 0 0 12px; }
    [contenteditable].editor figure { margin: 14px 0; }
    [contenteditable].editor figure img { max-width: 100%; border-radius: 8px; }
    [contenteditable].editor figure figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1.1em; }
    [contenteditable].editor figure figcaption:empty::before { content: attr(data-ph); font-style: italic; opacity: .75; }
    [contenteditable].editor blockquote { margin: 12px 0; padding-left: 14px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 14px; font-size: 18px; }
    .card h3 { margin: 20px 0 8px; font-size: 15px; color: var(--accent-dark); text-transform: uppercase; letter-spacing: .08em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=date], input[type=url], textarea, select {
      width: 100%; font: inherit; color: var(--text);
      padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(156,111,77,.15); }
    textarea { resize: vertical; }
    .field { margin-bottom: 12px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    table.list { width: 100%; border-collapse: collapse; }
    table.list th, table.list td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.list th { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .badge { display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
    .badge.ready { background: #e5f2e9; color: var(--ok); }
    .badge.pending { background: #fbeedd; color: var(--warn); }
    .badge.published { background: #e7edf5; color: #35507a; }
    .chip { display: inline-flex; gap: 6px; align-items: center; background: #f4eee5; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 4px; font-size: 13px; }
    .muted { color: var(--muted); }
    .ok { color: var(--ok); } .warn { color: var(--warn); }
    .list-files { display: flex; flex-direction: column; gap: 8px; }
    .file-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .file-row .name { flex: 1; word-break: break-all; font-size: 13px; }
    .upload-note { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
      max-width: 90vw; font-size: 14px; z-index: 50;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { background: var(--danger); }
    pre.json { background: #16120e; color: #e8dcc9; padding: 12px 14px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 320px; }
    .checklist { list-style: none; margin: 0; padding: 0; }
    .checklist li { padding: 4px 0; display: flex; gap: 8px; align-items: center; font-size: 14px; }
    .slug-box { display: flex; align-items: center; gap: 8px; }
    .slug-box input { flex: 1; background: #f4eee5; color: var(--muted); cursor: not-allowed; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .dropzone {
      border: 2px dashed var(--line); border-radius: var(--radius);
      padding: 30px 16px; text-align: center; color: var(--muted);
      background: var(--surface); cursor: pointer;
      transition: border-color .12s ease, background .12s ease;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: #f4eee5; }
    .dropzone:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .dropzone .dz-main { font-size: 15px; color: var(--text); }
    .dropzone small { display: block; margin-top: 4px; color: var(--muted); }
    .thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
    .photo-tile {
      position: relative; width: 100px; height: 100px; border-radius: 8px;
      border: 2px solid var(--line); overflow: hidden; background: #f4eee5; flex-shrink: 0;
    }
    .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-tile.is-cover { border-color: var(--accent); }
    .photo-tile .tile-x {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
      border-radius: 50%; border: 0; padding: 0; line-height: 1;
      background: rgba(22, 18, 14, .62); color: #fff; font-size: 13px; cursor: pointer; z-index: 2;
    }
    .photo-tile .tile-x:hover { background: var(--danger); }
    .photo-tile .tile-mark {
      position: absolute; bottom: 3px; font-size: 10px; font-weight: 700; line-height: 1;
      padding: 4px 7px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .65);
      background: rgba(22, 18, 14, .6); color: #fff; cursor: pointer; z-index: 2;
    }
    .photo-tile .tile-mark.mark-cover { left: 3px; }
    .photo-tile .tile-mark.mark-story { right: 3px; }
    .photo-tile .tile-mark.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .badge-chip {
      position: absolute; top: 2px; left: 2px; z-index: 2; font-size: 9px; font-weight: 700;
      background: rgba(22, 18, 14, .7); color: #fff; padding: 3px 6px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .photo-tile .tile-insert {
      position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); z-index: 2;
      font-size: 10px; font-weight: 700; line-height: 1; padding: 4px 8px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .65); background: rgba(22, 18, 14, .6); color: #fff; cursor: pointer;
    }
    .photo-tile .tile-insert:hover { background: var(--accent); border-color: var(--accent); }
    #loader {
      position: fixed; inset: 0; z-index: 70;
      display: flex; align-items: center; justify-content: center;
      background: rgba(250, 247, 242, .55);
      opacity: 0; pointer-events: none; transition: opacity .15s ease;
    }
    #loader.show { opacity: 1; pointer-events: auto; }
    #loader .loader-box {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: var(--shadow); padding: 18px 24px;
      display: flex; align-items: center; gap: 12px;
      font-size: 14px; color: var(--text);
    }
    #loader .spinner {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: 3px solid var(--line); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Casamentos<small>Controle de publicação</small></div>
    <div class="row">
      <button class="ghost" data-action="home" id="btn-home">Lista</button>
      <button class="primary" data-action="create">+ Novo evento</button>
    </div>
  </header>

  <main id="view"></main>
  <div id="toast"></div>
  <div id="loader" aria-hidden="true">
    <div class="loader-box" role="status">
      <div class="spinner"></div>
      <span id="loader-msg">Carregando…</span>
    </div>
  </div>

  <script>
    'use strict';
    var state = { slug: null, event: null, files: null, config: null, pending: [] };

    function $(sel, root) { return (root || document).querySelector(sel); }
    function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
    function byId(id) { return document.getElementById(id); }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmtDate(d) {
      if (!d) return '—';
      var m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[3] + '/' + m[2] + '/' + m[1] : String(d);
    }

    function run(fn) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        busy();
        var r = google.script.run
          .withSuccessHandler(function (v) { idle(); resolve(v); })
          .withFailureHandler(function (e) { idle(); reject(e); });
        r[fn].apply(r, args);
      });
    }

    var toastTimer = null;
    function toast(msg, isErr) {
      var t = byId('toast');
      t.textContent = msg;
      t.className = isErr ? 'show err' : 'show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.className = ''; }, 3600);
    }

    var _busy = 0;
    var _loaderTimer = null;
    function busy(msg) {
      _busy++;
      if (msg) byId('loader-msg').textContent = msg;
      if (_busy === 1) {
        clearTimeout(_loaderTimer);
        _loaderTimer = setTimeout(function () {
          byId('loader').classList.add('show');
          byId('loader').setAttribute('aria-hidden', 'false');
        }, 120);
      }
    }
    function idle() {
      _busy--;
      if (_busy <= 0) {
        _busy = 0;
        clearTimeout(_loaderTimer);
        byId('loader').classList.remove('show');
        byId('loader').setAttribute('aria-hidden', 'true');
      }
    }

    function ensureConfig() {
      if (state.config) return Promise.resolve(state.config);
      return run('apiConfig').then(function (cfg) { state.config = cfg; return cfg; });
    }

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-action]');
      if (!el) return;
      var action = el.getAttribute('data-action');
      if (action === 'home') { renderList(); return; }
      if (action === 'create') { renderCreate(); return; }
      if (action === 'edit') { renderEdit(el.getAttribute('data-slug')); return; }
      if (action === 'removefile') { onRemoveFile(el.getAttribute('data-kind'), el.getAttribute('data-name')); return; }
      if (action === 'insertstory') { insertStoryImage(el.getAttribute('data-name')); return; }
    });

    document.addEventListener('submit', function (ev) {
      var form = ev.target;
      if (form.id === 'f-create') { ev.preventDefault(); onCreate(form); return; }
      if (form.id === 'f-edit') { ev.preventDefault(); onSave(); return; }
    });

    document.addEventListener('selectionchange', function () {
      updateToolbarStates();
      captureStoryRange();
    });

    var savedStoryRange = null;
    function captureStoryRange() {
      var ed = byId('story-ed');
      if (!ed) { savedStoryRange = null; return; }
      var sel = document.getSelection();
      if (!sel || !sel.rangeCount) return;
      var r = sel.getRangeAt(0);
      if (r && ed.contains(r.startContainer)) savedStoryRange = r;
    }

    function placeCaretForInsert(ed) {
      var sel = document.getSelection();
      if (!sel) return;
      var inEditor = savedStoryRange && ed.contains(savedStoryRange.startContainer);
      var r = inEditor ? savedStoryRange : document.createRange();
      if (!inEditor) { r.selectNodeContents(ed); r.collapse(false); }
      sel.removeAllRanges();
      sel.addRange(r);
    }

    function blockState() {
      var v = '';
      try { v = String(document.queryCommandValue('formatBlock') || '').toLowerCase(); } catch (e) { v = ''; }
      v = v.replace(/[<>]/g, '');
      if (!v || v === 'div') return 'p';
      return v;
    }

    function updateToolbarStates() {
      var block = blockState();
      var ul = false, ol = false;
      try { ul = document.queryCommandState('insertUnorderedList'); } catch (e) {}
      try { ol = document.queryCommandState('insertOrderedList'); } catch (e) {}
      $$('.toolbar [data-cmd]').forEach(function (b) {
        var on = false;
        var cmd = b.getAttribute('data-cmd');
        if (cmd === 'formatBlock') on = block === (b.getAttribute('data-val') || '').toLowerCase();
        else if (cmd === 'insertUnorderedList') on = ul;
        else if (cmd === 'insertOrderedList') on = ol;
        b.classList.toggle('on', on);
      });
    }

    /* ------------------------------------------------------------------ */
    /* Lista                                                               */
    /* ------------------------------------------------------------------ */
    async function renderList() {
      var cfg = await ensureConfig();
      var events = await run('apiList');
      var rows = events.map(function (e) {
        var ready = e.ready === 'ready';
        var badge = e.status === 'published'
          ? '<span class="badge published">publicado</span>'
          : (ready ? '<span class="badge ready">pronto</span>' : '<span class="badge pending">incompleto</span>');
        var missed = e.missed && e.missed.length
          ? '<div class="hint warn">Falta: ' + esc(e.missed.join(', ')) + '</div>' : '';
        return '<tr>' +
          '<td><strong>' + esc(e.couple) + '</strong>' + (e.featured ? ' ★' : '') +
          '<div class="hint">' + esc(e.slug) + '</div>' + missed + '</td>' +
          '<td>' + esc(e.city) + (e.state ? '/' + esc(e.state) : '') + '</td>' +
          '<td>' + fmtDate(e.date) + '</td>' +
          '<td>' + badge + '</td>' +
          '<td class="row" style="justify-content:flex-end">' +
          '<button class="small" data-action="edit" data-slug="' + esc(e.slug) + '">Editar</button>' +
          '<button class="small primary" data-action="edit" data-slug="' + esc(e.slug) + '" data-go="publish">Publicar</button>' +
          '</td></tr>';
      }).join('');

      byId('view').innerHTML =
        '<div class="card"><h2>Eventos <span class="muted">(' + events.length + ')</span></h2>' +
        '<p class="muted">Crie um evento, preencha os dados, envie as fotos e execute a automação para publicar no site.</p></div>' +
        (events.length
          ? '<div class="card" style="overflow-x:auto"><table class="list"><thead><tr>' +
            '<th>Casamento</th><th>Cidade</th><th>Data</th><th>Status</th><th></th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<div class="card empty">Nenhum evento ainda. Clique em "+ Novo evento".</div>');
    }

    /* ------------------------------------------------------------------ */
    /* Criar                                                               */
    /* ------------------------------------------------------------------ */
    function renderCreate() {
      byId('view').innerHTML =
        '<form id="f-create">' +
        '<div class="card">' +
        '<h2>Novo evento</h2>' +
        '<p class="muted">Comece pelo essencial. O slug é gerado automaticamente e o restante é preenchido na edição.</p>' +
        '<div class="grid">' +
        '<div class="field"><label>Nome do casal *</label><input type="text" name="couple" required autofocus placeholder="Marina e Pedro"></div>' +
        '<div class="field"><label>Título</label><input type="text" name="title" placeholder="Marina + Pedro"></div>' +
        '<div class="field"><label>Data</label><input type="date" name="date"></div>' +
        '<div class="field"><label>Cidade</label><input type="text" name="city" placeholder="Ouro Preto"></div>' +
        '<div class="field"><label>Estado</label><input type="text" name="state" placeholder="MG"></div>' +
        '<div class="field"><label>Local</label><input type="text" name="location" placeholder="Museu da Inconfidência"></div>' +
        '<div class="field"><label>Espaço / Venue</label><input type="text" name="venue"></div>' +
        '</div>' +
        '<div class="actions"><button class="primary" type="submit">Criar evento</button>' +
        '<button type="button" class="ghost" data-action="home">Cancelar</button></div>' +
        '</div></form>';
    }

    function onCreate(form) {
      var fd = new FormData(form);
      var payload = {
        couple: fd.get('couple').trim(),
        title: (fd.get('title') || '').trim(),
        date: (fd.get('date') || '').trim(),
        city: (fd.get('city') || '').trim(),
        state: (fd.get('state') || '').trim(),
        location: (fd.get('location') || '').trim(),
        venue: (fd.get('venue') || '').trim(),
      };
      var submit = form.querySelector('[type=submit]');
      submit.disabled = true; submit.textContent = 'Criando…';
      run('apiCreate', payload).then(function (e) {
        toast('Evento "' + e.couple + '" criado com slug "' + e.slug + '"');
        renderEdit(e.slug);
      }, function (err) {
        toast(err.message, true);
        submit.disabled = false; submit.textContent = 'Criar evento';
      });
    }

    /* ------------------------------------------------------------------ */
    /* Edição                                                              */
    /* ------------------------------------------------------------------ */
    async function renderEdit(slug) {
      state.slug = slug;
      try {
        state.event = await run('apiGet', slug);
      } catch (err) { toast(err.message, true); renderList(); return; }
      state.files = await run('apiListFiles', slug);

      var e = state.event;
      var vendors = (e.vendors || []).map(function (v, i) { return vendorRow(i, v); }).join('');

      byId('view').innerHTML =
        '<div class="row" style="margin-bottom:14px">' +
        '<a class="ghost btn" data-action="home">← Lista</a>' +
        '<div class="grow"></div>' +
        '<button class="small danger" id="btn-delete">Apagar evento</button>' +
        '</div>' +

        '<form id="f-edit">' +
        '<div class="card"><h2>Dados do casamento</h2>' +
        '<div class="slug-box field"><label style="margin-bottom:4px">Slug (URL pública)</label>' +
        '<input type="text" id="slug-field" value="' + esc(e.slug) + '" readonly>' +
        '<button type="button" class="small" id="btn-regenerate-slug">Gerar novo</button></div>' +
        '<div class="grid">' +
        '<div class="field"><label>Título</label><input type="text" id="f-title" value="' + esc(e.title) + '"></div>' +
        '<div class="field"><label>Nome do casal</label><input type="text" id="f-couple" value="' + esc(e.couple) + '"></div>' +
        '<div class="field"><label>Data</label><input type="date" id="f-date" value="' + esc(e.date) + '"></div>' +
        '<div class="field"><label>Local</label><input type="text" id="f-location" value="' + esc(e.location) + '"></div>' +
        '<div class="field"><label>Cidade</label><input type="text" id="f-city" value="' + esc(e.city) + '"></div>' +
        '<div class="field"><label>Estado</label><input type="text" id="f-state" value="' + esc(e.state) + '"></div>' +
        '<div class="field"><label>Espaço / Venue</label><input type="text" id="f-venue" value="' + esc(e.venue) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Description — teaser da página</label><textarea id="f-description" rows="3">' + esc(e.description) + '</textarea></div>' +
        '<div class="field"><label>Excerpt — legenda curta (máx. 220)</label><textarea id="f-excerpt" rows="2" maxlength="220">' + esc(e.excerpt) + '</textarea></div>' +
        '<label class="check"><input type="checkbox" id="f-featured"' + (e.featured ? ' checked' : '') + '> Destacar na home</label>' +
        '<div class="field"><label>Tags (separadas por vírgula)</label><input type="text" id="f-tags" value="' + esc((e.tags || []).join(', ')) + '" placeholder="casamento, ouro-preto, casal"></div>' +
        '<div class="field"><label>SEO title</label><input type="text" id="f-seoTitle" value="' + esc(e.seoTitle || '') + '"></div>' +
        '<div class="field"><label>SEO description (máx. 160)</label><textarea id="f-seoDescription" rows="2" maxlength="160">' + esc(e.seoDescription || '') + '</textarea></div>' +
        '</div>' +

        '<div class="card"><h2>A história</h2>' +
        '<p class="muted">Texto principal da página. Use o editor, intercale as fotos do story com "Inserir foto".</p>' +
        '<div class="toolbar">' +
        '<button type="button" class="b" data-cmd="bold">B</button>' +
        '<button type="button" class="i" data-cmd="italic">I</button>' +
        '<button type="button" class="u" data-cmd="underline">U</button>' +
        '<button type="button" data-cmd="formatBlock" data-val="p">P</button>' +
        '<button type="button" data-cmd="formatBlock" data-val="h2">H2</button>' +
        '<button type="button" data-cmd="formatBlock" data-val="h3">H3</button>' +
        '<button type="button" data-cmd="formatBlock" data-val="blockquote">Citação</button>' +
        '<button type="button" data-cmd="insertUnorderedList">• Lista</button>' +
        '<button type="button" data-cmd="insertOrderedList">1. Lista</button>' +
        '<span class="grow"></span>' +
        '<button type="button" class="primary" id="btn-insert-story">Inserir foto do story</button>' +
        '</div>' +
        '<div contenteditable="true" class="editor" id="story-ed"></div>' +
        '<div class="hint" style="margin-top:6px">Fotos aparecem como blocos de imagem aqui e viram imagens no markdown do site. Clique na legenda abaixo de cada foto para escrever o texto dela.</div>' +
        '</div>' +

        '<div class="card"><h2>Fornecedores</h2>' +
        '<div id="vendors">' + (vendors || '<p class="muted">Nenhum fornecedor ainda.</p>') + '</div>' +
        '<button type="button" class="small" id="btn-add-vendor">+ Adicionar fornecedor</button>' +
        '</div>' +

        '<div class="card"><h2>Fotos</h2>' +
        '<p class="muted">Jogue todas as fotos na área abaixo. Marque a <strong>Capa</strong> e as usadas no <strong>Story</strong>; o restante entra na galeria.</p>' +
        '<div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Enviar fotos">' +
        '<span class="dz-main">Arraste as fotos para cá</span>' +
        '<small>ou clique para selecionar — envie tudo de uma vez</small>' +
        '<input type="file" id="photo-file" multiple accept="image/*" hidden>' +
        '</div>' +
        '<div id="pending-thumbs" class="thumbs" style="margin-top:12px"></div>' +
        '<div class="row" style="margin-top:12px">' +
        '<button type="button" class="primary" id="btn-upload-photos" disabled>Enviar fotos</button>' +
        '<span class="hint" id="upload-summary"></span></div>' +
        '<h3 style="margin-top:20px">Já enviadas</h3>' +
        '<div id="files-cover"></div>' +
        '<div id="files-gallery"></div>' +
        '<div id="files-story"></div>' +
        '</div>' +

        '<div class="card"><h2>Automação / publicação</h2>' +
        '<ul class="checklist" id="checklist"></ul>' +
        '<div class="actions" style="margin-top:14px">' +
        '<button type="button" class="primary" id="btn-publish">Executar automação</button>' +
        '<button type="button" id="btn-preview">Ver JSON da publicação</button>' +
        '</div>' +
        '<pre class="json" id="json-preview" hidden></pre>' +
        '<div class="hint" style="margin-top:10px">A automação dispara o workflow "publish-wedding" no GitHub, que baixa estes dados, baixa as fotos do Drive, gera a pasta do evento e faz commit.</div>' +
        '</div>' +

        '<div class="row" style="justify-content:space-between; margin-top:6px">' +
        '<button type="submit" class="primary">Salvar alterações</button>' +
        '<button type="button" class="ghost" data-action="home">Voltar para a lista</button>' +
        '</div>' +
        '</form>';

      byId('story-ed').innerHTML = e.historia_html || '';
      fixupStoryEditor();
      bindEditListeners();
      refreshFilesPane();
      refreshPublishPane();
    }

    function vendorRow(i, v) {
      v = v || {};
      return '<div class="row vendor-row" style="margin-bottom:8px; align-items:flex-end">' +
        '<div style="flex:1"><input type="text" data-vendor="role" placeholder="Espaço / Decoração ..." value="' + esc(v.role || '') + '"></div>' +
        '<div style="flex:1"><input type="text" data-vendor="name" placeholder="Nome" value="' + esc(v.name || '') + '"></div>' +
        '<div style="flex:1"><input type="text" data-vendor="instagram" placeholder="@instagram" value="' + esc(v.instagram || '') + '"></div>' +
        '<button type="button" class="small danger" data-remove-vendor>Remover</button>' +
        '</div>';
    }

    function bindEditListeners() {
      var ed = byId('story-ed');

      $$('.toolbar [data-cmd]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          ed.focus();
          var cmd = btn.getAttribute('data-cmd');
          var val = btn.getAttribute('data-val') || null;
          if (cmd === 'formatBlock') {
            document.execCommand('formatBlock', false, blockState() === (val || '').toLowerCase() ? 'p' : val);
          } else {
            document.execCommand(cmd, false, val);
          }
          updateToolbarStates();
        });
      });

      byId('btn-insert-story').addEventListener('click', function () { openStoryPicker(); });
      byId('btn-add-vendor').addEventListener('click', function () {
        byId('vendors').insertAdjacentHTML('beforeend', vendorRow(Date.now(), {}));
      });
      byId('vendors').addEventListener('click', function (ev) {
        if (ev.target.closest('[data-remove-vendor]')) ev.target.closest('.vendor-row').remove();
      });

      byId('btn-regenerate-slug').addEventListener('click', function () {
        var couple = byId('f-couple').value.trim();
        var city = byId('f-city').value.trim();
        if (!couple) { toast('Preencha o nome do casal primeiro.', true); return; }
        var base = couple.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        var slug = base;
        if (city) slug = base + '-' + city.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        byId('slug-field').value = slug;
      });

      byId('btn-delete').addEventListener('click', function () {
        if (!confirm('Apagar o evento "' + state.event.couple + '" e suas referências? (As fotos no Drive permanecem).')) return;
        run('apiDelete', state.slug).then(function () { toast('Evento apagado.'); renderList(); }, function (err) { toast(err.message, true); });
      });

      byId('btn-publish').addEventListener('click', onPublish);
      byId('btn-preview').addEventListener('click', onPreview);

      var dz = byId('dropzone');
      dz.addEventListener('click', function () { byId('photo-file').click(); });
      dz.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); byId('photo-file').click(); }
      });
      ['dragenter', 'dragover'].forEach(function (type) {
        dz.addEventListener(type, function (ev) { ev.preventDefault(); dz.classList.add('drag'); });
      });
      ['dragleave', 'drop'].forEach(function (type) {
        dz.addEventListener(type, function (ev) { ev.preventDefault(); dz.classList.remove('drag'); });
      });
      dz.addEventListener('drop', function (ev) {
        var files = ev.dataTransfer && ev.dataTransfer.files;
        if (files && files.length) addPendingFiles(files);
      });
      byId('photo-file').addEventListener('change', function () {
        addPendingFiles(byId('photo-file').files);
        byId('photo-file').value = '';
      });
      byId('pending-thumbs').addEventListener('click', onPendingClick);
      byId('btn-upload-photos').addEventListener('click', onUploadPhotos);
    }

    /* ------------------------------------------------------------------ */
    /* Upload de fotos (dropzone + marcação capa/story/galeria)            */
    /* ------------------------------------------------------------------ */
    function addPendingFiles(fileList) {
      if (!fileList || !fileList.length) { toast('Selecione uma imagem primeiro.', true); return; }
      var files = Array.prototype.filter.call(fileList, function (f) { return !f.type || f.type.indexOf('image/') === 0; });
      if (files.length < fileList.length) toast('Arquivos não-imagem ignorados.', true);
      if (!files.length) return;
      state.pending = state.pending.concat(files.map(function (f) {
        return {
          id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          file: f,
          name: f.name,
          objectUrl: URL.createObjectURL(f),
          cover: false,
          story: false,
        };
      }));
      renderPending();
    }

    function renderPending() {
      var box = byId('pending-thumbs');
      box.innerHTML = state.pending.map(function (p) {
        return '<div class="photo-tile' + (p.cover ? ' is-cover' : '') + '" data-pid="' + esc(p.id) + '" title="' + esc(p.name) + '">' +
          '<img src="' + p.objectUrl + '" alt="">' +
          '<button type="button" class="tile-x" data-remove-pending title="Remover">\u00d7</button>' +
          '<button type="button" class="tile-mark mark-cover' + (p.cover ? ' on' : '') + '" data-mark-pending="cover" title="Usar como capa">Capa</button>' +
          '<button type="button" class="tile-mark mark-story' + (p.story ? ' on' : '') + '" data-mark-pending="story" title="Usar no story">Story</button>' +
          '</div>';
      }).join('');
      updateUploadSummary();
    }

    function onPendingClick(ev) {
      var tile = ev.target.closest('.photo-tile');
      if (!tile) return;
      var pid = tile.getAttribute('data-pid');
      var p = state.pending.filter(function (x) { return x.id === pid; })[0];
      if (!p) return;
      if (ev.target.closest('[data-remove-pending]')) {
        try { URL.revokeObjectURL(p.objectUrl); } catch (e) {}
        state.pending = state.pending.filter(function (x) { return x.id !== pid; });
        renderPending();
        return;
      }
      if (ev.target.closest('[data-mark-pending="cover"]')) {
        state.pending.forEach(function (x) { x.cover = x.id === pid; });
        renderPending();
        return;
      }
      if (ev.target.closest('[data-mark-pending="story"]')) {
        p.story = !p.story;
        renderPending();
        return;
      }
    }

    function updateUploadSummary() {
      var btn = byId('btn-upload-photos');
      var sum = byId('upload-summary');
      if (!btn || !sum) return;
      var n = state.pending.length;
      if (n === 0) { btn.disabled = true; btn.textContent = 'Enviar fotos'; sum.textContent = ''; return; }
      var cover = state.pending.filter(function (p) { return p.cover; }).length;
      var story = state.pending.filter(function (p) { return p.story; }).length;
      btn.disabled = false;
      btn.textContent = 'Enviar fotos (' + n + ')';
      var parts = ['galeria: ' + (n - cover - story)];
      if (cover) parts.push('capa: 1');
      if (story) parts.push('story: ' + story);
      sum.textContent = parts.join(' \u00b7 ');
    }

    function readPayload(file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          resolve({ data: String(r.result).split(',')[1], name: file.name, type: file.type || 'image/jpeg' });
        };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function toPayloads(list) {
      return list.reduce(function (chain, p) {
        return chain.then(function (acc) {
          return readPayload(p.file).then(function (pl) { acc.push(pl); return acc; });
        });
      }, Promise.resolve([]));
    }

    function onUploadPhotos() {
      if (!state.pending.length) return;
      var cover = state.pending.filter(function (p) { return p.cover; });
      var story = state.pending.filter(function (p) { return p.story; });
      var gallery = state.pending.filter(function (p) { return !p.cover && !p.story; });
      busy('Enviando fotos para o Drive\u2026');

      var chain = Promise.resolve();
      if (cover.length) {
        chain = chain.then(function () {
          return toPayloads(cover).then(function (pl) {
            return run('apiUploadCover', state.slug, pl[0]).then(function (files) { state.files = files; });
          });
        });
      }
      if (story.length) {
        chain = chain.then(function () {
          return toPayloads(story).then(function (pl) {
            return run('apiUploadFiles', state.slug, 'story', pl).then(function (files) { state.files = files; });
          });
        });
      }
      if (gallery.length) {
        chain = chain.then(function () {
          return toPayloads(gallery).then(function (pl) {
            return run('apiUploadFiles', state.slug, 'gallery', pl).then(function (files) { state.files = files; });
          });
        });
      }

      chain.then(function () {
        state.pending.forEach(function (p) { try { URL.revokeObjectURL(p.objectUrl); } catch (e) {} });
        state.pending = [];
        toast('Fotos enviadas para o Google Drive.');
        renderPending();
        refreshFilesPane();
        refreshPublishPane();
      }, function (err) {
        toast('Falha no envio: ' + err.message, true);
      }).then(function () {
        idle();
        updateUploadSummary();
      });
    }

    function onRemoveFile(kind, name) {
      run('apiRemoveFile', state.slug, kind, name).then(function (files) {
        state.files = files;
        refreshFilesPane();
        refreshPublishPane();
      }, function (err) { toast(err.message, true); });
    }

    function refreshFilesPane() {
      var f = state.files || { cover: null, gallery: [], story: [] };

      byId('files-cover').innerHTML = f.cover
        ? '<div class="thumbs">' + fileTile(f.cover.name, 'cover', f.cover.id, 'Capa') + '</div>'
        : '<p class="hint upload-note">Nenhuma capa enviada.</p>';

      byId('files-gallery').innerHTML = (f.gallery.length
        ? '<div class="thumbs">' + f.gallery.map(function (x) { return fileTile(x.name, 'gallery', x.id, ''); }).join('') + '</div>'
        : '<p class="hint upload-note">Nenhuma foto na galeria.</p>');

      byId('files-story').innerHTML = (f.story.length
        ? '<div class="thumbs">' + f.story.map(function (x) { return fileTile(x.name, 'story', x.id, 'Story'); }).join('') + '</div>'
        : '<p class="hint upload-note">Nenhuma foto no story.</p>');

      updateUploadSummary();
    }

    function fileTile(name, kind, id, badge) {
      var insert = kind === 'story'
        ? '<button type="button" class="tile-insert" data-action="insertstory" data-name="' + esc(name) + '" title="Inserir no texto">+ Inserir</button>'
        : '';
      return '<div class="photo-tile" title="' + esc(name) + '">' +
        '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w200" alt="">' +
        (badge ? '<span class="badge-chip">' + esc(badge) + '</span>' : '') +
        insert +
        '<button type="button" class="tile-x" data-action="removefile" data-kind="' + esc(kind) + '" data-name="' + esc(name) + '" title="Remover">\u00d7</button>' +
        '</div>';
    }

    /* ------------------------------------------------------------------ */
    /* Inserir foto do story no editor                                     */
    /* ------------------------------------------------------------------ */
    function storyImageUrl(id) {
      return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w800';
    }

    function storyFile(name) {
      return (state.files && state.files.story || []).filter(function (x) { return x.name === name; })[0];
    }

    function openStoryPicker() {
      var f = state.files || { story: [] };
      if (!f.story.length) { toast('Envie fotos na aba Story primeiro.', true); return; }
      var list = f.story.map(function (x, i) {
        return '<button type="button" class="small" data-story-name="' + esc(x.name) + '" style="text-align:left; flex:1">' + esc(x.name) + '</button>';
      }).join('');
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(22,18,14,.5);display:flex;align-items:center;justify-content:center;z-index:60';
      overlay.innerHTML = '<div class="card" style="width:min(90vw,480px)"><h2>Inserir foto no texto</h2>' +
        '<p class="muted">Escolha uma foto do story. A legenda é editada clicando nela, abaixo da foto, dentro do editor.</p>' +
        '<div class="row" style="flex-direction:column;align-items:stretch;gap:6px;margin-bottom:12px">' + list + '</div>' +
        '<button class="ghost" id="close-picker">Cancelar</button></div>';
      overlay.addEventListener('click', function (ev) {
        var btn = ev.target.closest('[data-story-name]');
        if (btn) {
          insertStoryImage(btn.getAttribute('data-story-name'));
          overlay.remove();
        } else if (ev.target.id === 'close-picker' || ev.target === overlay) {
          overlay.remove();
        }
      });
      document.body.appendChild(overlay);
    }

    function insertStoryImage(name) {
      var ed = byId('story-ed');
      var file = storyFile(name);
      var img = '<img data-story="' + esc(name) + '" src="' + (file ? storyImageUrl(file.id) : '') + '" alt="">';
      var fig = '<figure class="story-img">' + img +
        '<figcaption data-ph="Clique para adicionar legenda"></figcaption></figure>';
      placeCaretForInsert(ed);
      ed.focus();
      document.execCommand('insertHTML', false, '<p>' + fig + '</p>');
      updateToolbarStates();
    }

    function fixupStoryEditor() {
      var ed = byId('story-ed');
      if (!ed) return;
      $$('figure.story-img img[data-story]', ed).forEach(function (im) {
        var file = storyFile(im.getAttribute('data-story'));
        if (file) im.setAttribute('src', storyImageUrl(file.id));
        var fig = im.closest('figure');
        if (fig) {
          var cap = fig.querySelector('figcaption');
          if (cap) {
            var t = cap.textContent.replace(/\s+/g, ' ').trim();
            var ph = cap.getAttribute('data-ph') || '';
            im.setAttribute('alt', t === ph ? '' : t);
          }
        }
      });
    }

    function storyHtml() {
      var ed = byId('story-ed');
      $$('figure.story-img img[data-story]', ed).forEach(function (im) {
        var fig = im.closest('figure');
        var cap = fig ? fig.querySelector('figcaption') : null;
        var t = cap ? cap.textContent.replace(/\s+/g, ' ').trim() : '';
        var ph = cap ? (cap.getAttribute('data-ph') || '') : '';
        im.setAttribute('alt', t === ph ? '' : t);
      });
      return ed.innerHTML;
    }

    /* ------------------------------------------------------------------ */
    /* Salvar                                                              */
    /* ------------------------------------------------------------------ */
    function collectEdit() {
      var tags = byId('f-tags').value.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
      var vendors = $$('#vendors .vendor-row').map(function (row) {
        var get = function (n) { var el = row.querySelector('[data-vendor="' + n + '"]'); return el ? el.value.trim() : ''; };
        var name = get('name');
        if (!name) return null;
        return { role: get('role'), name: name, instagram: get('instagram') };
      }).filter(Boolean);

      return {
        title: byId('f-title').value.trim(),
        couple: byId('f-couple').value.trim(),
        date: byId('f-date').value,
        location: byId('f-location').value.trim(),
        city: byId('f-city').value.trim(),
        state: byId('f-state').value.trim(),
        venue: byId('f-venue').value.trim(),
        description: byId('f-description').value.trim(),
        excerpt: byId('f-excerpt').value.trim(),
        featured: byId('f-featured').checked,
        tags: tags,
        vendors: vendors,
        seoTitle: byId('f-seoTitle').value.trim(),
        seoDescription: byId('f-seoDescription').value.trim(),
        historia_html: storyHtml(),
      };
    }

    function onSave() {
      var payload = collectEdit();
      var btn = byId('f-edit').querySelector('[type=submit]');
      btn.disabled = true; btn.textContent = 'Salvando…';
      run('apiSave', state.slug, payload).then(function (e) {
        state.event = e;
        toast('Alterações salvas.');
        refreshPublishPane();
      }, function (err) {
        toast(err.message, true);
      }).then(function () {
        btn.disabled = false; btn.textContent = 'Salvar alterações';
      });
    }

    /* ------------------------------------------------------------------ */
    /* Checklist + publicar                                                */
    /* ------------------------------------------------------------------ */
    function collectStatusProbe() {
      var e = state.event;
      var files = state.files || { cover: null, gallery: [], story: [] };
      var min = state.config ? state.config.minGallery : 8;
      var probe = {
        title: e.title, couple: e.couple, date: e.date,
        location: e.location, city: e.city, state: e.state, venue: e.venue,
        description: e.description, excerpt: e.excerpt, historia_html: e.historia_html,
        cover_id: files.cover ? files.cover.id : '',
        gallery: files.gallery, story: files.story,
      };
      var missed = [];
      ['title', 'couple', 'date', 'location', 'city', 'state', 'venue', 'description', 'excerpt', 'historia_html'].forEach(function (f) {
        if (String(probe[f] || '').trim() === '') missed.push(f);
      });
      if (!files.cover) missed.push('cover');
      if (files.gallery.length < min) missed.push('gallery (' + files.gallery.length + '/' + min + ')');
      if (files.story.length === 0) missed.push('story');
      return { missed: missed };
    }

    function refreshPublishPane() {
      var probe = collectStatusProbe();
      var items = [
        ['Título e casal', !!state.event.title && !!state.event.couple],
        ['Data', !!state.event.date],
        ['Local · cidade · estado · venue', !!state.event.location && !!state.event.city && !!state.event.state && !!state.event.venue],
        ['Description', !!state.event.description],
        ['Excerpt', !!state.event.excerpt],
        ['História (texto)', !!(state.event.historia_html || '').replace(/<[^>]+>/g, '').trim()],
        ['Capa enviada', !!(state.files && state.files.cover)],
        ['Galeria (mín. ' + (state.config ? state.config.minGallery : 8) + ')', !!(state.files && state.files.gallery && state.files.gallery.length >= (state.config ? state.config.minGallery : 8))],
        ['Fotos do story', !!(state.files && state.files.story && state.files.story.length)],
      ];
      byId('checklist').innerHTML = items.map(function (it) {
        return '<li>' + (it[1] ? '<span class="ok">✓</span>' : '<span class="warn">✗</span>') + '<span class="muted">' + esc(it[0]) + '</span></li>';
      }).join('');
      byId('checklist').insertAdjacentHTML('beforeend', '<li class="muted" style="margin-top:6px">' +
        (probe.missed.length ? 'Falta: <span class="warn">' + esc(probe.missed.join(', ')) + '</span>'
          : '<span class="ok">Tudo pronto para publicar.</span>') + '</li>');
    }

    function onPublish() {
      var btn = byId('btn-publish');
      btn.disabled = true;
      btn.textContent = 'Disparando…';
      busy('Disparando a automação no GitHub…');
      run('apiPublish', state.slug).then(function (r) {
        toast('Automação disparada. O workflow vai gerar /casamentos/' + r.slug + ' e fazer commit.');
        renderList();
      }, function (err) {
        toast('Não foi possível publicar: ' + err.message, true);
        btn.disabled = false;
        btn.textContent = 'Executar automação';
      }).then(function () {
        idle();
      });
    }

    function onPreview() {
      var pre = byId('json-preview');
      if (!pre.hidden) { pre.hidden = true; return; }
      run('apiPublication', state.slug).then(function (json) {
        pre.textContent = JSON.stringify(json, null, 2);
        pre.hidden = false;
      }, function (err) { toast(err.message, true); });
    }

    /* ------------------------------------------------------------------ */
    renderList();
  </script>
</body>
</html>
