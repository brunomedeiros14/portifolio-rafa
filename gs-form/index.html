<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg: #faf7f2;
        /*  */
        --surface: #ffffff;
        --text: #16120e;
        --muted: #6b5f53;
        --line: #e5ddcf;
        --accent: #9c6f4d;
        --accent-dark: #7c5737;
        --ok: #2f7d4f;
        --warn: #b4682d;
        --danger: #b23b3b;
        --radius: 10px;
        --shadow:
          0 1px 2px rgba(22, 18, 14, 0.06), 0 8px 24px rgba(22, 18, 14, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      header.top .brand {
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 20px;
      }
      header.top .brand small {
        display: block;
        font-family: system-ui;
        font-style: normal;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
      }
      button,
      .btn {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          opacity 0.12s ease;
      }
      button:hover {
        background: #f4eee5;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-dark);
        border-color: var(--accent-dark);
      }
      button.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      button.danger {
        color: var(--danger);
        border-color: var(--line);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.small {
        padding: 4px 9px;
        font-size: 13px;
        border-radius: 6px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 20px;
        box-shadow: var(--shadow);
        margin-bottom: 18px;
      }
      .card h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }
      .card h3 {
        margin: 20px 0 8px;
        font-size: 15px;
        color: var(--accent-dark);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="date"],
      input[type="url"],
      textarea,
      select {
        width: 100%;
        font: inherit;
        color: var(--text);
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(156, 111, 77, 0.15);
      }
      textarea {
        resize: vertical;
      }
      .field {
        margin-bottom: 12px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
      }
      table.list {
        width: 100%;
        border-collapse: collapse;
      }
      table.list th,
      table.list td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      table.list th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 999px;
        font-weight: 600;
      }
      .badge.ready {
        background: #e5f2e9;
        color: var(--ok);
      }
      .badge.pending {
        background: #fbeedd;
        color: var(--warn);
      }
      .badge.published {
        background: #e7edf5;
        color: #35507a;
      }
      .chip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        background: #f4eee5;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        margin: 4px;
        font-size: 13px;
      }
      .muted {
        color: var(--muted);
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .list-files {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .file-row .name {
        flex: 1;
        word-break: break-all;
        font-size: 13px;
      }
      .upload-note {
        font-size: 12px;
        color: var(--muted);
        margin: 6px 0 10px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        background: var(--text);
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
        max-width: 90vw;
        font-size: 14px;
        z-index: 50;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #toast.err {
        background: var(--danger);
      }
      pre.json {
        background: #16120e;
        color: #e8dcc9;
        padding: 12px 14px;
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
        max-height: 320px;
      }
      .checklist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .checklist li {
        padding: 4px 0;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 14px;
      }
      .slug-box {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .slug-box input {
        flex: 1;
        background: #f4eee5;
        color: var(--muted);
        cursor: not-allowed;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dropzone {
        border: 2px dashed var(--line);
        border-radius: var(--radius);
        padding: 30px 16px;
        text-align: center;
        color: var(--muted);
        background: var(--surface);
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }
      .dropzone:hover,
      .dropzone.drag {
        border-color: var(--accent);
        background: #f4eee5;
      }
      .dropzone:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .dropzone .dz-main {
        font-size: 15px;
        color: var(--text);
      }
      .dropzone small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
      }
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .photo-tile {
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 8px;
        border: 2px solid var(--line);
        overflow: hidden;
        background: #f4eee5;
        flex-shrink: 0;
      }
      .photo-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .photo-tile.is-cover {
        border-color: var(--accent);
      }
      .photo-tile .tile-x {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        line-height: 1;
        background: rgba(22, 18, 14, 0.62);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        z-index: 2;
      }
      .photo-tile .tile-x:hover {
        background: var(--danger);
      }
      .photo-tile .tile-mark {
        position: absolute;
        bottom: 3px;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        padding: 4px 7px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        background: rgba(22, 18, 14, 0.6);
        color: #fff;
        cursor: pointer;
        z-index: 2;
      }
      .photo-tile .tile-mark.mark-cover {
        left: 3px;
      }
      .photo-tile .tile-mark.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .badge-chip {
        position: absolute;
        top: 2px;
        left: 2px;
        z-index: 2;
        font-size: 9px;
        font-weight: 700;
        background: rgba(22, 18, 14, 0.7);
        color: #fff;
        padding: 3px 6px;
        border-radius: 999px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .photo-tile.uploading img {
        filter: saturate(0.6) brightness(0.9);
      }
      .photo-tile.is-loading img,
      .photo-tile.is-failed img {
        opacity: 0;
      }
      .photo-tile .tile-skeleton {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          100deg,
          #ece3d6 30%,
          #faf6ef 50%,
          #ece3d6 70%
        );
        background-size: 240% 100%;
        animation: shimmer 1.1s ease-in-out infinite;
      }
      .photo-tile.is-loaded .tile-skeleton,
      .photo-tile.is-failed .tile-skeleton {
        display: none;
      }
      .photo-tile .tile-fail {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(178, 59, 59, 0.55);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        cursor: default;
      }
      .photo-tile.is-failed .tile-fail {
        display: flex;
      }
      .photo-tile .tile-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(250, 247, 242, 0.5);
        cursor: default;
      }
      .photo-tile .tile-overlay .spinner.sm {
        width: 18px;
        height: 18px;
        border-width: 2px;
      }
      .photo-tile .tile-overlay.tile-error {
        background: rgba(178, 59, 59, 0.55);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
      }
      .photo-tile .tile-insert {
        position: absolute;
        bottom: 3px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        background: rgba(22, 18, 14, 0.6);
        color: #fff;
        cursor: pointer;
      }
      .photo-tile .tile-insert:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(250, 247, 242, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }
      #loader.show {
        opacity: 1;
        pointer-events: auto;
      }
      #loader .loader-box {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: var(--text);
      }
      #loader .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex-shrink: 0;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes shimmer {
        from {
          background-position: 160% 0;
        }
        to {
          background-position: -60% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .photo-tile .tile-skeleton {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">Casamentos<small>Controle de publicação</small></div>
      <div class="row">
        <button class="ghost" data-action="home" id="btn-home">Lista</button>
        <button class="primary" data-action="create">+ Novo evento</button>
      </div>
    </header>

    <main id="view"></main>
    <div id="toast"></div>
    <div id="loader" aria-hidden="true">
      <div class="loader-box" role="status">
        <div class="spinner"></div>
        <span id="loader-msg">Carregando…</span>
      </div>
    </div>

    <script>
      "use strict";
      var state = {
        slug: null,
        event: null,
        files: null,
        config: null,
        uploads: [],
      };

      function $(sel, root) {
        return (root || document).querySelector(sel);
      }
      function $$(sel, root) {
        return Array.from((root || document).querySelectorAll(sel));
      }
      function byId(id) {
        return document.getElementById(id);
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      function fmtDate(d) {
        if (!d) return "—";
        var m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
        return m ? m[3] + "/" + m[2] + "/" + m[1] : String(d);
      }

      function run(fn) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          busy();
          var r = google.script.run
            .withSuccessHandler(function (v) {
              idle();
              resolve(v);
            })
            .withFailureHandler(function (e) {
              idle();
              reject(e);
            });
          r[fn].apply(r, args);
        });
      }

      /** Chamada sem o loader global — usada no envio em segundo plano das fotos. */
      function runQuiet(fn) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var r = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);
          r[fn].apply(r, args);
        });
      }

      var toastTimer = null;
      function toast(msg, isErr) {
        var t = byId("toast");
        t.textContent = msg;
        t.className = isErr ? "show err" : "show";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          t.className = "";
        }, 3600);
      }

      var _busy = 0;
      var _loaderTimer = null;
      function busy(msg) {
        _busy++;
        if (msg) byId("loader-msg").textContent = msg;
        if (_busy === 1) {
          clearTimeout(_loaderTimer);
          _loaderTimer = setTimeout(function () {
            byId("loader").classList.add("show");
            byId("loader").setAttribute("aria-hidden", "false");
          }, 120);
        }
      }
      function idle() {
        _busy--;
        if (_busy <= 0) {
          _busy = 0;
          clearTimeout(_loaderTimer);
          byId("loader").classList.remove("show");
          byId("loader").setAttribute("aria-hidden", "true");
        }
      }

      function ensureConfig() {
        if (state.config) return Promise.resolve(state.config);
        return run("apiConfig").then(function (cfg) {
          state.config = cfg;
          return cfg;
        });
      }

      document.addEventListener("click", function (ev) {
        var el = ev.target.closest("[data-action]");
        if (!el) return;
        var action = el.getAttribute("data-action");
        if (action === "home") {
          renderList();
          return;
        }
        if (action === "create") {
          renderCreate();
          return;
        }
        if (action === "edit") {
          renderEdit(el.getAttribute("data-slug"));
          return;
        }
      });

      document.addEventListener("submit", function (ev) {
        var form = ev.target;
        if (form.id === "f-create") {
          ev.preventDefault();
          onCreate(form);
          return;
        }
        if (form.id === "f-edit") {
          ev.preventDefault();
          onSave();
          return;
        }
      });

      /* ------------------------------------------------------------------ */
      /* Lista                                                               */
      /* ------------------------------------------------------------------ */
      async function renderList() {
        var cfg = await ensureConfig();
        var events = await run("apiList");
        var rows = events
          .map(function (e) {
            var ready = e.ready === "ready";
            var badge =
              e.status === "published"
                ? '<span class="badge published">publicado</span>'
                : ready
                  ? '<span class="badge ready">pronto</span>'
                  : '<span class="badge pending">incompleto</span>';
            var missed =
              e.missed && e.missed.length
                ? '<div class="hint warn">Falta: ' +
                  esc(e.missed.join(", ")) +
                  "</div>"
                : "";
            return (
              "<tr>" +
              "<td><strong>" +
              esc(e.couple) +
              "</strong>" +
              (e.featured ? " ★" : "") +
              '<div class="hint">' +
              esc(e.slug) +
              "</div>" +
              missed +
              "</td>" +
              "<td>" +
              esc([e.venue, e.city].filter(Boolean).join(", ")) +
              (e.state ? " · " + esc(e.state) : "") +
              "</td>" +
              "<td>" +
              fmtDate(e.date) +
              "</td>" +
              "<td>" +
              badge +
              "</td>" +
              '<td class="row" style="justify-content:flex-end">' +
              '<button class="small" data-action="edit" data-slug="' +
              esc(e.slug) +
              '">Editar</button>' +
              '<button class="small primary" data-action="edit" data-slug="' +
              esc(e.slug) +
              '" data-go="publish">Publicar</button>' +
              "</td></tr>"
            );
          })
          .join("");

        byId("view").innerHTML =
          '<div class="card"><h2>Eventos <span class="muted">(' +
          events.length +
          ")</span></h2>" +
          '<p class="muted">Crie um evento, preencha os dados, envie as fotos e execute a automação para publicar no site.</p></div>' +
          (events.length
            ? '<div class="card" style="overflow-x:auto"><table class="list"><thead><tr>' +
              "<th>Casamento</th><th>Cidade</th><th>Data</th><th>Status</th><th></th>" +
              "</tr></thead><tbody>" +
              rows +
              "</tbody></table></div>"
            : '<div class="card empty">Nenhum evento ainda. Clique em "+ Novo evento".</div>');
      }

      /* ------------------------------------------------------------------ */
      /* Criar                                                               */
      /* ------------------------------------------------------------------ */
      function renderCreate() {
        byId("view").innerHTML =
          '<form id="f-create">' +
          '<div class="card">' +
          "<h2>Novo evento</h2>" +
          '<p class="muted">Comece pelo essencial. O slug é gerado automaticamente e o restante é preenchido na edição.</p>' +
          '<div class="grid">' +
          '<div class="field"><label>Nome do casal *</label><input type="text" name="couple" required autofocus placeholder="Yara e Ataíde"></div>' +
          '<div class="field"><label>Data</label><input type="date" name="date"></div>' +
          '<div class="field"><label>Cidade *</label><input type="text" name="city" required placeholder="Ouro Preto"></div>' +
          '<div class="field"><label>Estado *</label><input type="text" name="state" required placeholder="MG"></div>' +
          '<div class="field"><label>Local (opcional)</label><input type="text" name="venue" placeholder="Museu da Inconfidência"></div>' +
          "</div>" +
          '<div class="actions"><button class="primary" type="submit">Criar evento</button>' +
          '<button type="button" class="ghost" data-action="home">Cancelar</button></div>' +
          "</div></form>";
      }

      function onCreate(form) {
        var fd = new FormData(form);
        var payload = {
          couple: fd.get("couple").trim(),
          date: (fd.get("date") || "").trim(),
          city: (fd.get("city") || "").trim(),
          state: (fd.get("state") || "").trim(),
          venue: (fd.get("venue") || "").trim(),
        };
        var submit = form.querySelector("[type=submit]");
        submit.disabled = true;
        submit.textContent = "Criando…";
        run("apiCreate", payload).then(
          function (e) {
            toast('Evento "' + e.couple + '" criado com slug "' + e.slug + '"');
            renderEdit(e.slug);
          },
          function (err) {
            toast(err.message, true);
            submit.disabled = false;
            submit.textContent = "Criar evento";
          },
        );
      }

      /* ------------------------------------------------------------------ */
      /* Edição                                                              */
      /* ------------------------------------------------------------------ */
      async function renderEdit(slug) {
        state.slug = slug;
        try {
          state.event = await run("apiGet", slug);
        } catch (err) {
          toast(err.message, true);
          renderList();
          return;
        }
        state.files = await run("apiListFiles", slug);

        var e = state.event;

        byId("view").innerHTML =
          '<div class="row" style="margin-bottom:14px">' +
          '<a class="ghost btn" data-action="home">← Lista</a>' +
          '<div class="grow"></div>' +
          '<button class="small danger" id="btn-delete">Apagar evento</button>' +
          "</div>" +
          '<form id="f-edit">' +
          '<div class="card"><h2>Dados do casamento</h2>' +
          '<div class="slug-box field"><label style="margin-bottom:4px">Slug (URL pública)</label>' +
          '<input type="text" id="slug-field" value="' +
          esc(e.slug) +
          '" readonly>' +
          '<button type="button" class="small" id="btn-regenerate-slug">Gerar novo</button></div>' +
          '<div class="grid">' +
          '<div class="field"><label>Nome do casal</label><input type="text" id="f-couple" value="' +
          esc(e.couple) +
          '"></div>' +
          '<div class="field"><label>Data</label><input type="date" id="f-date" value="' +
          esc(e.date) +
          '"></div>' +
          '<div class="field"><label>Cidade *</label><input type="text" id="f-city" value="' +
          esc(e.city) +
          '"></div>' +
          '<div class="field"><label>Estado *</label><input type="text" id="f-state" value="' +
          esc(e.state) +
          '"></div>' +
          '<div class="field"><label>Local (opcional)</label><input type="text" id="f-venue" value="' +
          esc(e.venue) +
          '" placeholder="Museu da Inconfidência"></div>' +
          "</div>" +
          '<div class="field"><label>Description — frase da intro</label><textarea id="f-description" rows="3">' +
          esc(e.description) +
          "</textarea></div>" +
          '<div class="field"><label>Excerpt — legenda curta dos cards (máx. 220)</label><textarea id="f-excerpt" rows="2" maxlength="220">' +
          esc(e.excerpt) +
          "</textarea></div>" +
          '<label class="check"><input type="checkbox" id="f-featured"' +
          (e.featured ? " checked" : "") +
          "> Destacar na home</label>" +
          '<div class="field"><label>Tags (separadas por vírgula)</label><input type="text" id="f-tags" value="' +
          esc((e.tags || []).join(", ")) +
          '" placeholder="casamento, ouro-preto, casal"></div>' +
          "</div>" +
          '<div class="card"><h2>Fotos</h2>' +
          '<p class="muted">Arraste ou selecione as fotos: cada uma é enviada em segundo plano (uma por vez) para a pasta do evento. Todas entram na <strong>galeria</strong> e uma pode virar a <strong>Capa</strong>.</p>' +
          '<div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Enviar fotos">' +
          '<span class="dz-main">Arraste as fotos para cá</span>' +
          "<small>ou clique para selecionar — envio em segundo plano</small>" +
          '<input type="file" id="photo-file" multiple accept="image/*" hidden>' +
          "</div>" +
          '<div id="photos-grid" class="thumbs" style="margin-top:12px"></div>' +
          '<div id="upload-bar" style="margin-top:12px"></div>' +
          "</div>" +
          '<div class="card"><h2>Automação / publicação</h2>' +
          '<ul class="checklist" id="checklist"></ul>' +
          '<div class="actions" style="margin-top:14px">' +
          '<button type="button" class="primary" id="btn-publish">Executar automação</button>' +
          '<button type="button" id="btn-preview">Ver JSON da publicação</button>' +
          "</div>" +
          '<pre class="json" id="json-preview" hidden></pre>' +
          '<div class="hint" style="margin-top:10px">A automação dispara o workflow "publish-wedding" no GitHub, que baixa estes dados, baixa as fotos do Drive, gera a pasta do evento e faz commit.</div>' +
          "</div>" +
          '<div class="row" style="justify-content:space-between; margin-top:6px">' +
          '<button type="submit" class="primary">Salvar alterações</button>' +
          '<button type="button" class="ghost" data-action="home">Voltar para a lista</button>' +
          "</div>" +
          "</form>";

        bindEditListeners();
        renderPhotos();
        refreshPublishPane();
      }

      function bindEditListeners() {
        byId("btn-regenerate-slug").addEventListener("click", function () {
          var couple = byId("f-couple").value.trim();
          // O slug usa a cidade e ignora o estabelecimento: o local é opcional e
          // mudá-lo não deve quebrar a URL. Sem cidade, fica só com o nome do casal.
          var city = byId("f-city").value.trim();
          if (!couple) {
            toast("Preencha o nome do casal primeiro.", true);
            return;
          }
          var slugify = function (t) {
            return t
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "");
          };
          var base = slugify(couple);
          var slug = base;
          if (city) slug = base + "-" + slugify(city);
          byId("slug-field").value = slug;
        });

        byId("btn-delete").addEventListener("click", function () {
          if (
            !confirm(
              'Apagar o evento "' +
                state.event.couple +
                '" e suas referências? (As fotos no Drive permanecem).',
            )
          )
            return;
          run("apiDelete", state.slug).then(
            function () {
              toast("Evento apagado.");
              renderList();
            },
            function (err) {
              toast(err.message, true);
            },
          );
        });

        byId("btn-publish").addEventListener("click", onPublish);
        byId("btn-preview").addEventListener("click", onPreview);

        var dz = byId("dropzone");
        dz.addEventListener("click", function () {
          byId("photo-file").click();
        });
        dz.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            byId("photo-file").click();
          }
        });
        ["dragenter", "dragover"].forEach(function (type) {
          dz.addEventListener(type, function (ev) {
            ev.preventDefault();
            dz.classList.add("drag");
          });
        });
        ["dragleave", "drop"].forEach(function (type) {
          dz.addEventListener(type, function (ev) {
            ev.preventDefault();
            dz.classList.remove("drag");
          });
        });
        dz.addEventListener("drop", function (ev) {
          var files = ev.dataTransfer && ev.dataTransfer.files;
          if (files && files.length) addUploads(files);
        });
        byId("photo-file").addEventListener("change", function () {
          addUploads(byId("photo-file").files);
          byId("photo-file").value = "";
        });
        byId("photos-grid").addEventListener("click", function (ev) {
          var rm = ev.target.closest("[data-remove-photo]");
          if (rm) {
            onRemovePhoto(rm.getAttribute("data-name"));
            return;
          }
          var sc = ev.target.closest("[data-setcover]");
          if (sc) {
            var name = sc.getAttribute("data-name");
            onSetCover(
              state.files &&
                state.files.cover &&
                state.files.cover.name === name
                ? ""
                : name,
            );
            return;
          }
          var retry = ev.target.closest("[data-retry]");
          if (retry) {
            retryUpload(retry.getAttribute("data-id"));
            return;
          }
          var cancel = ev.target.closest("[data-cancel-upload]");
          if (cancel) {
            cancelUpload(cancel.getAttribute("data-id"));
            return;
          }
        });
      }

      /* ------------------------------------------------------------------ */
      /* Upload de fotos (fundo, 1 por vez, pasta única, nome UUID)         */
      /* ------------------------------------------------------------------ */
      function uploadsPending() {
        return state.uploads.filter(function (u) {
          return u.status === "pending" || u.status === "uploading";
        }).length;
      }

      function addUploads(fileList) {
        if (!fileList || !fileList.length) {
          toast("Selecione uma imagem primeiro.", true);
          return;
        }
        var files = Array.prototype.filter.call(fileList, function (f) {
          return !f.type || f.type.indexOf("image/") === 0;
        });
        if (files.length < fileList.length)
          toast("Arquivos não-imagem ignorados.", true);
        if (!files.length) return;
        var fresh = files.map(function (f) {
          var u = {
            id:
              "u" +
              Date.now().toString(36) +
              Math.random().toString(36).slice(2, 7),
            file: f,
            label: f.name,
            objectUrl: URL.createObjectURL(f),
            status: "pending",
            error: "",
          };
          state.uploads.push(u);
          return u;
        });
        var grid = byId("photos-grid");
        if (grid) {
          appendTiles_(
            grid,
            fresh
              .map(function (u) {
                return uploadingTile(u);
              })
              .join(""),
          );
        }
        updateUploadBar();
        processUploadQueue();
      }

      function readPayload(file) {
        return new Promise(function (resolve, reject) {
          var r = new FileReader();
          r.onload = function () {
            resolve({
              data: String(r.result).split(",")[1],
              name: file.name,
              type: file.type || "image/jpeg",
            });
          };
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }

      var uploadRunning = false;
      function processUploadQueue() {
        if (uploadRunning) return;
        uploadRunning = true;
        (function pump() {
          var next = state.uploads.filter(function (u) {
            return u.status === "pending";
          })[0];
          if (!next) {
            uploadRunning = false;
            updateUploadBar();
            return;
          }
          next.status = "uploading";
          replaceUploadTile_(next, uploadingTile(next));
          updateUploadBar();
          readPayload(next.file)
            .then(function (pl) {
              return runQuiet("apiUploadPhoto", state.slug, pl);
            })
            .then(
              function (files) {
                var known = {};
                ((state.files && state.files.photos) || []).forEach(
                  function (p) {
                    known[p.id] = true;
                  },
                );
                var added = (files.photos || []).filter(function (p) {
                  return !known[p.id];
                });
                state.files = files;
                state.uploads = state.uploads.filter(function (u) {
                  return u.id !== next.id;
                });
                try {
                  URL.revokeObjectURL(next.objectUrl);
                } catch (e) {}
                // A tile da fila vira a foto no mesmo lugar. O re-render
                // completo é só o plano B, caso o servidor não tenha devolvido
                // exatamente uma foto nova.
                if (added.length === 1) {
                  replaceUploadTile_(next, uploadedTile(added[0]));
                  bindPhotoImages();
                } else {
                  renderPhotos();
                }
                refreshPublishPane();
                pump();
              },
              function (err) {
                next.status = "error";
                next.error = err.message || "Falha no envio";
                replaceUploadTile_(next, uploadingTile(next));
                updateUploadBar();
                pump();
              },
            );
        })();
      }

      function retryUpload(id) {
        var u = state.uploads.filter(function (x) {
          return x.id === id;
        })[0];
        if (!u) return;
        u.status = "pending";
        u.error = "";
        replaceUploadTile_(u, uploadingTile(u));
        updateUploadBar();
        processUploadQueue();
      }

      function cancelUpload(id) {
        var u = state.uploads.filter(function (x) {
          return x.id === id;
        })[0];
        if (!u) return;
        try {
          URL.revokeObjectURL(u.objectUrl);
        } catch (e) {}
        state.uploads = state.uploads.filter(function (x) {
          return x.id !== id;
        });
        var grid = byId("photos-grid");
        var node = grid && grid.querySelector('[data-upload-id="' + id + '"]');
        if (node) node.parentNode.removeChild(node);
        updateUploadBar();
      }

      function tileImgUrl(p) {
        return (
          "https://lh3.googleusercontent.com/d/" +
          encodeURIComponent(p.id) +
          "=w400"
        );
      }

      function uploadedTile(p) {
        var isCover =
          state.files && state.files.cover && state.files.cover.name === p.name;
        return (
          '<div class="photo-tile is-loading' +
          (isCover ? " is-cover" : "") +
          '" data-photo="' +
          esc(p.name) +
          '" title="' +
          esc(p.label || p.name) +
          '">' +
          '<span class="tile-skeleton"></span>' +
          '<img src="' +
          tileImgUrl(p) +
          '" alt="" decoding="async">' +
          '<span class="tile-fail" title="A miniatura não carregou">!</span>' +
          (isCover ? '<span class="badge-chip">capa</span>' : "") +
          '<button type="button" class="tile-x" data-remove-photo data-name="' +
          esc(p.name) +
          '" title="Remover">\u00d7</button>' +
          '<button type="button" class="tile-mark mark-cover' +
          (isCover ? " on" : "") +
          '" data-setcover data-name="' +
          esc(p.name) +
          '" title="Usar como capa">Capa</button>' +
          "</div>"
        );
      }

      /**
       * Liga o carregamento das miniaturas. A tile nasce em `is-loading` (só o
       * skeleton) e vira `is-loaded` ou `is-failed` no `load`/`error` do <img>.
       * Como a grid é montada por innerHTML, a imagem pode ter resolvido antes do
       * bind — daí o `complete`.
       */
      function bindPhotoImages() {
        all(".photo-tile[data-photo] img").forEach(function (img) {
          var tile = img.closest(".photo-tile");
          var settle = function (ok) {
            img.removeEventListener("load", onLoad);
            img.removeEventListener("error", onError);
            tile.classList.remove("is-loading");
            tile.classList.add(ok ? "is-loaded" : "is-failed");
          };
          var onLoad = function () {
            settle(true);
          };
          var onError = function () {
            settle(false);
          };
          img.addEventListener("load", onLoad);
          img.addEventListener("error", onError);
          if (img.complete) settle(img.naturalWidth > 0);
        });
      }

      function uploadingTile(u) {
        var overlay =
          '<span class="tile-overlay"><span class="spinner sm"></span></span>';
        if (u.status === "pending")
          overlay =
            '<span class="tile-overlay"><span class="hint">aguardando</span></span>';
        if (u.status === "error")
          overlay =
            '<span class="tile-overlay tile-error" title="' +
            esc(u.error) +
            '">!</span>';
        var retry =
          u.status === "error"
            ? '<button type="button" class="tile-insert" data-retry data-id="' +
              esc(u.id) +
              '" title="Tentar novamente">Reenviar</button>'
            : "";
        return (
          '<div class="photo-tile uploading" data-upload-id="' +
          esc(u.id) +
          '" title="' +
          esc(u.label) +
          '">' +
          '<img src="' +
          u.objectUrl +
          '" alt="">' +
          overlay +
          '<button type="button" class="tile-x" data-cancel-upload data-id="' +
          esc(u.id) +
          '" title="Cancelar">\u00d7</button>' +
          retry +
          "</div>"
        );
      }

      function renderPhotos() {
        var grid = byId("photos-grid");
        if (!grid) return;
        var tiles = [];
        ((state.files && state.files.photos) || []).forEach(function (p) {
          tiles.push(uploadedTile(p));
        });
        state.uploads.forEach(function (u) {
          tiles.push(uploadingTile(u));
        });
        grid.innerHTML =
          tiles.join("") ||
          '<p class="hint upload-note">Nenhuma foto ainda. Arraste ou selecione acima.</p>';
        bindPhotoImages();
        updateUploadBar();
      }

      /**
       * Acrescenta tiles ao fim da grid — a fila de uploads sempre vive depois
       * das fotos já enviadas, então "fim" é a posição correta. Remove também o
       * aviso de lista vazia.
       */
      function appendTiles_(grid, html) {
        clearEmptyNote_(grid);
        var holder = document.createElement("div");
        holder.innerHTML = html;
        while (holder.firstChild) grid.appendChild(holder.firstChild);
      }

      /**
       * Troca uma única tile por um trecho novo de HTML. Sem isso, cada foto
       * enviada redesenharia a grid inteira e o browser ia buscar de novo todas
       * as miniaturas do Drive — com dezenas de fotos a lista piscava a cada
       * envio. Se a tile alvo não existe mais, a nova entra no fim.
       */
      function replaceTile_(grid, selector, html) {
        clearEmptyNote_(grid);
        var holder = document.createElement("div");
        holder.innerHTML = html;
        var fresh = holder.firstChild;
        var node = selector ? grid.querySelector(selector) : null;
        if (node && node.parentNode) node.parentNode.replaceChild(fresh, node);
        else grid.appendChild(fresh);
        return fresh;
      }

      function clearEmptyNote_(grid) {
        var note = grid.querySelector(".upload-note");
        if (note) note.parentNode.removeChild(note);
      }

      function replaceUploadTile_(upload, html) {
        var grid = byId("photos-grid");
        if (!grid) return;
        replaceTile_(grid, '[data-upload-id="' + upload.id + '"]', html);
      }

      function updateUploadBar() {
        var bar = byId("upload-bar");
        if (!bar) return;
        var n = ((state.files && state.files.photos) || []).length;
        var pending = uploadsPending();
        var errs = state.uploads.filter(function (u) {
          return u.status === "error";
        }).length;
        var parts = ["Enviadas: " + n];
        if (pending) parts.push("Fila: " + pending);
        if (errs) parts.push("Falhas: " + errs + " (Reenviar)");
        bar.innerHTML =
          '<span class="hint">' +
          esc(parts.join(" \u00b7 ")) +
          "</span>" +
          (pending
            ? '<span class="hint warn" style="margin-left:8px">Salvar e publicar ficam bloqueados até os envios terminarem.</span>'
            : "");
        updateSaveLock();
      }

      function updateSaveLock() {
        var locked = uploadsPending() > 0;
        var saveBtn =
          byId("f-edit") && byId("f-edit").querySelector("[type=submit]");
        var pubBtn = byId("btn-publish");
        if (saveBtn) saveBtn.disabled = locked;
        if (saveBtn)
          saveBtn.textContent = locked
            ? "Aguarde o envio das fotos\u2026"
            : "Salvar alterações";
        if (pubBtn) pubBtn.disabled = locked;
        if (pubBtn)
          pubBtn.textContent = locked
            ? "Aguardando uploads\u2026"
            : "Executar automação";
      }

      function onRemovePhoto(name) {
        if (!confirm("Remover esta foto?")) return;
        busy("Removendo foto\u2026");
        run("apiRemovePhoto", state.slug, name)
          .then(
            function (files) {
              state.files = files;
              renderPhotos();
              refreshPublishPane();
            },
            function (err) {
              toast(err.message, true);
            },
          )
          .then(function () {
            idle();
          });
      }

      function onSetCover(name) {
        busy("Salvando capa\u2026");
        run("apiSetCover", state.slug, name)
          .then(
            function (files) {
              state.files = files;
              renderPhotos();
              refreshPublishPane();
            },
            function (err) {
              toast(err.message, true);
            },
          )
          .then(function () {
            idle();
          });
      }

      /* ------------------------------------------------------------------ */
      /* Salvar                                                              */
      /* ------------------------------------------------------------------ */
      function collectEdit() {
        var tags = byId("f-tags")
          .value.split(",")
          .map(function (t) {
            return t.trim();
          })
          .filter(Boolean);

        return {
          couple: byId("f-couple").value.trim(),
          date: byId("f-date").value,
          city: byId("f-city").value.trim(),
          state: byId("f-state").value.trim(),
          venue: byId("f-venue").value.trim(),
          description: byId("f-description").value.trim(),
          excerpt: byId("f-excerpt").value.trim(),
          featured: byId("f-featured").checked,
          tags: tags,
        };
      }

      function onSave() {
        var payload = collectEdit();
        var btn = byId("f-edit").querySelector("[type=submit]");
        btn.disabled = true;
        btn.textContent = "Salvando…";
        run("apiSave", state.slug, payload)
          .then(
            function (e) {
              state.event = e;
              toast("Alterações salvas.");
              refreshPublishPane();
            },
            function (err) {
              toast(err.message, true);
            },
          )
          .then(function () {
            updateSaveLock();
          });
      }

      /* ------------------------------------------------------------------ */
      /* Checklist + publicar                                                */
      /* ------------------------------------------------------------------ */
      function collectStatusProbe() {
        var e = state.event;
        var files = state.files || { cover: null, photos: [] };
        var min = state.config ? state.config.minGallery : 8;
        var photos = files.photos || [];
        var galleryCount = photos.filter(function (p) {
          return !files.cover || files.cover.name !== p.name;
        }).length;
        var probe = {
          couple: e.couple,
          date: e.date,
          city: e.city,
          state: e.state,
          description: e.description,
          excerpt: e.excerpt,
          cover_id: files.cover ? files.cover.id : "",
          galleryCount: galleryCount,
        };
        var missed = [];
        [
          "couple",
          "date",
          "city",
          "state",
          "description",
          "excerpt",
        ].forEach(function (f) {
          if (String(probe[f] || "").trim() === "") missed.push(f);
        });
        if (!files.cover) missed.push("cover");
        if (galleryCount < min)
          missed.push("gallery (" + galleryCount + "/" + min + ")");
        return { missed: missed, galleryCount: galleryCount };
      }

      function refreshPublishPane() {
        var probe = collectStatusProbe();
        var min = state.config ? state.config.minGallery : 8;
        var items = [
          ["Casal", !!state.event.couple],
          ["Data", !!state.event.date],
          ["Cidade · estado", !!state.event.city && !!state.event.state],
          ["Local (opcional)", true],
          ["Description (intro)", !!state.event.description],
          ["Excerpt", !!state.event.excerpt],
          ["Capa enviada", !!(state.files && state.files.cover)],
          ["Galeria (mín. " + min + ")", probe.galleryCount >= min],
        ];
        byId("checklist").innerHTML = items
          .map(function (it) {
            return (
              "<li>" +
              (it[1]
                ? '<span class="ok">✓</span>'
                : '<span class="warn">✗</span>') +
              '<span class="muted">' +
              esc(it[0]) +
              "</span></li>"
            );
          })
          .join("");
        byId("checklist").insertAdjacentHTML(
          "beforeend",
          '<li class="muted" style="margin-top:6px">' +
            (probe.missed.length
              ? 'Falta: <span class="warn">' +
                esc(probe.missed.join(", ")) +
                "</span>"
              : '<span class="ok">Tudo pronto para publicar.</span>') +
            "</li>",
        );
      }

      function onPublish() {
        var btn = byId("btn-publish");
        btn.disabled = true;
        btn.textContent = "Disparando…";
        busy("Disparando a automação no GitHub…");
        run("apiPublish", state.slug)
          .then(
            function (r) {
              toast(
                "Automação disparada. O workflow vai gerar /casamentos/" +
                  r.slug +
                  " e fazer commit.",
              );
              renderList();
            },
            function (err) {
              toast("Não foi possível publicar: " + err.message, true);
              updateSaveLock();
            },
          )
          .then(function () {
            idle();
          });
      }

      function onPreview() {
        var pre = byId("json-preview");
        if (!pre.hidden) {
          pre.hidden = true;
          return;
        }
        run("apiPublication", state.slug).then(
          function (json) {
            pre.textContent = JSON.stringify(json, null, 2);
            pre.hidden = false;
          },
          function (err) {
            toast(err.message, true);
          },
        );
      }

      /* ------------------------------------------------------------------ */
      renderList();
    </script>
  </body>
</html>
